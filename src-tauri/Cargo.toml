[package]
name = "dsh-manager"
version = "0.1.0"
description = "DSH Manager：DSH Web 的版本、来源、运行与自启管理"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The _lib suffix may seem redundant but it is necessary to make the lib name unique
# and wouldn't conflict with the bin name. See https://github.com/rust-lang/cargo/issues/8519
name = "dsh_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 应用框架与官方插件（主计划 §1.2）
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
log = "0.4"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 出网：必须保留默认特性（默认特性含 system-proxy，FR-1.8 的唯一实现来源，主计划 §1.3 红线 1）
reqwest = { version = "0.13", features = ["json", "stream"] }

# 版本比较 / 进程与磁盘 / 摘要（主计划 §1.2 裁定表）
semver = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
sha2 = "0.11"

# 异步支撑：端口 trait 对象安全、取消令牌与超时、并发探测（T-V3 的 join_all）
async-trait = "0.1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "sync",
  "process",
  "io-util",
  "fs",
] }
futures-util = "0.3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
